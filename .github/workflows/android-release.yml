name: Android release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true

      - name: Confirm this is the current main revision
        shell: bash
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git fetch origin "$BRANCH_NAME"
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse "origin/$BRANCH_NAME")" ]]; then
            echo "A newer main revision is available; this run will not publish a stale APK." >&2
            exit 1
          fi

      - name: Increment app version
        id: version
        shell: bash
        run: |
          version="$(python tools/bump_version.py)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Prepare persistent Android signing key
        shell: bash
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$ANDROID_SIGNING_KEYSTORE_BASE64" ]]; then
            echo "Missing repository secret ANDROID_SIGNING_KEYSTORE_BASE64" >&2
            exit 1
          fi
          printf '%s' "$ANDROID_SIGNING_KEYSTORE_BASE64" \
            | base64 --decode > "$RUNNER_TEMP/codex-quota-monitor.jks"

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Build signed release APK
        env:
          ANDROID_SIGNING_STORE_FILE: ${{ runner.temp }}/codex-quota-monitor.jks
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: flutter build apk --release --android-project-arg=kotlin.incremental=false

      - name: Commit version bump
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "chore: bump version to ${RELEASE_VERSION}"
          git push origin "HEAD:refs/heads/${BRANCH_NAME}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Codex Quota Monitor v${{ steps.version.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: build/app/outputs/flutter-apk/app-release.apk
