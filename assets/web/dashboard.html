<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Codex 额度监控</title>
  <style>
    :root{--bg:#080d15;--card:#0e1622;--card2:#111c2a;--line:#223044;--muted:#7f91a8;--text:#ecf4ff;--cyan:#42d9ff;--green:#48e5a4;--purple:#ae83ff;--warning:#ffb74d;--danger:#ff647c;--track:#1a2635}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif}body{display:flex;align-items:center;justify-content:center}
    button{font:inherit}.shell{flex:0 0 auto;width:1280px;height:800px;padding:14px;display:grid;grid-template-rows:42px minmax(0,46fr) minmax(0,54fr);gap:12px;transform:scale(var(--dashboard-scale,1));transform-origin:center center}
    header{display:flex;align-items:center;min-width:0}.brand{font-size:25px;font-weight:750;white-space:nowrap}.pill{margin-left:12px;padding:5px 10px;border:1px solid var(--cyan);border-radius:99px;color:var(--cyan);font-size:11px;font-weight:800;background:#42d9ff12}.pill:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin-right:6px;vertical-align:1px}
    .meta{margin-left:auto;display:flex;align-items:center;gap:18px;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden}.meta span{overflow:hidden;text-overflow:ellipsis}.meta b{color:var(--green);font-weight:500;margin-right:5px}
    .top,.bottom{display:grid;grid-template-columns:2fr 1fr;gap:14px;min-height:0}.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;min-width:0;min-height:0;overflow:hidden}.cyan{border-color:#42d9ff42}.purple{border-color:#ae83ff42}
    .quota-panel{display:grid;grid-template-rows:minmax(145px,1.1fr) 1px minmax(130px,.9fr);gap:12px}.divider{background:var(--line)}.quota-head{display:flex;align-items:baseline;gap:12px}.section-title{font-size:17px;font-weight:750}.quota-number{font:800 46px/1 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--cyan);letter-spacing:-2px}.caption{font-size:11px;color:var(--muted)}.countdown-label{margin-left:auto}.countdown{font:800 30px/1 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--green);letter-spacing:-1px}
    .tracks{margin:14px 0 10px}.track{height:8px;background:var(--track);overflow:hidden}.track-main{height:16px;border-radius:8px 8px 2px 2px}.track-time{height:8px;margin-top:2px;border-radius:2px 2px 8px 8px}.track.segmented{display:flex;gap:3px;background:transparent;overflow:visible}.track-segment{flex:1;min-width:0;height:100%;border-radius:3px;background:var(--track);overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#42d9ff88,var(--cyan));transition:width 2.4s cubic-bezier(.22,.68,0,1)}.time-fill{background:linear-gradient(90deg,#278f73,var(--green),#90f2c7)}.secondary-quota{margin:-2px 0 10px}.secondary-head{display:flex;justify-content:space-between;gap:10px;margin-bottom:5px;color:var(--muted);font-size:10px}.secondary-head span:last-child{text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mini-track{height:5px;border-radius:5px;background:var(--track);overflow:hidden;margin-bottom:7px}.secondary-quota .mini-track{margin:0}
    .quota-foot{display:flex;justify-content:space-between;gap:15px;color:var(--muted);font-size:11px}.quota-foot span:last-child{text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.subhead{font-weight:750;font-size:13px}.additional-list{height:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px 22px;align-content:start;overflow:auto;padding-right:3px}.additional{min-width:0}.additional-head{display:flex;justify-content:space-between;gap:8px;margin-bottom:8px}.additional-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:700}.additional-value{font:700 14px ui-monospace,monospace}.additional-detail{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .credits{display:grid;grid-template-rows:28px 1fr;gap:12px}.credits-head{display:flex;align-items:center;gap:8px}.balance{font-weight:750;font-size:17px;overflow:hidden;text-overflow:ellipsis}.reset-count{margin-left:auto;color:var(--purple);font-size:14px;font-weight:750}.tickets{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(96px,1fr);gap:8px;overflow-x:auto}.ticket{border:1px solid #ae83ff4d;border-radius:12px;background:#ae83ff10;padding:10px 7px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;min-width:96px}.ticket.urgent{border-color:#ffb74d55;background:#ffb74d10}.ticket-id{font-size:10px;color:#ae83ffaa}.ticket-days{font:800 46px/1 ui-monospace,monospace;color:var(--purple)}.ticket.urgent .ticket-days{color:var(--warning)}.ticket-unit,.ticket-date{font-size:10px;color:var(--muted)}.empty{height:100%;display:grid;place-items:center;color:var(--muted);font-size:13px}
    .history{display:grid;grid-template-rows:30px 26px 1fr;gap:5px}.panel-head{display:flex;align-items:center;min-width:0}.panel-title{font-size:16px;font-weight:750;white-space:nowrap}.tabs{margin-left:auto;display:flex;align-items:center;gap:4px}.tabs label{font-size:10px;color:var(--muted);margin:0 4px 0 8px}.tab,.mode-tab{border:0;background:transparent;color:var(--muted);font-size:11px;padding:5px 8px;border-radius:7px;cursor:pointer}.tab:hover,.mode-tab:hover{background:var(--card2);color:var(--text)}.tab.active{background:#42d9ff18;color:var(--cyan)}.mode-tabs{display:flex;align-items:center;gap:3px}.mode-tab.active{background:#42d9ff18;color:var(--cyan)}.mode-tab[data-mode="consumption"].active{background:#48e5a418;color:var(--green)}.mode-note{margin-left:8px;font-size:10px;color:var(--muted)}.chart-wrap{position:relative;min-height:0}.chart-wrap canvas{position:absolute;inset:0;width:100%;height:100%}.chart-empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:12px;pointer-events:none}.chart-empty[hidden]{display:none}
    .chart-tooltip{position:absolute;z-index:2;pointer-events:none;white-space:nowrap;padding:6px 8px;border:1px solid var(--line);border-radius:5px;background:#0b1927ed;color:var(--text);font:11px ui-monospace,monospace}.chart-tooltip[hidden]{display:none}
    .events{display:grid;grid-template-rows:30px 1fr;gap:8px}.event-list{overflow:auto}.event{display:grid;grid-template-columns:8px 1fr auto;gap:9px;padding:9px 0;border-bottom:1px solid #22304499;align-items:start}.event:last-child{border:0}.dot{width:6px;height:6px;border-radius:50%;background:var(--cyan);margin-top:6px}.event[data-type="reset"] .dot{background:var(--purple)}.event[data-type="auth_error"] .dot{background:var(--danger)}.event-title{font-size:12px;font-weight:650}.event-desc{font-size:10px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.event-time{font:10px ui-monospace,monospace;color:var(--muted)}
    .additional-list,.tickets,.event-list{scrollbar-width:none}.additional-list::-webkit-scrollbar,.tickets::-webkit-scrollbar,.event-list::-webkit-scrollbar{display:none}
    .error-banner{display:none;position:fixed;right:18px;bottom:18px;padding:10px 14px;border:1px solid #ff647c66;border-radius:10px;background:#25131a;color:#ff9aaa;font-size:12px;z-index:5}.error-banner.show{display:block}
    @media (orientation:portrait), (max-width:900px){
      html,body{height:auto;min-height:100%;overflow-x:hidden;overflow-y:auto}
      body{display:block}
      .shell{width:min(100%,900px);height:auto;min-height:100vh;margin:0 auto;padding:14px;grid-template-rows:none;gap:12px;transform:none}
      header{flex-wrap:wrap;gap:8px}
      .brand{font-size:21px}.pill{margin-left:0}
      .meta{width:100%;margin-left:0;gap:5px 12px;flex-wrap:wrap;white-space:normal;overflow:visible}
      .meta span{overflow:visible;text-overflow:clip}
      .top,.bottom{grid-template-columns:minmax(0,1fr);gap:12px}
      .panel{padding:14px;overflow:visible}
      .quota-panel{grid-template-rows:auto 1px auto;gap:14px}
      .quota-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:baseline;gap:8px}
      .quota-number{font-size:40px}.countdown-label{grid-column:1;margin-left:0}.countdown{grid-column:2/4;font-size:27px}
      .quota-foot{flex-wrap:wrap;gap:4px 12px}.quota-foot span:last-child{text-align:left;white-space:normal}
      .additional-list{height:auto;grid-template-columns:repeat(2,minmax(0,1fr));overflow:visible}
      .credits{grid-template-rows:auto auto}.credits-head{flex-wrap:wrap}
      .tickets{min-height:150px;grid-auto-columns:minmax(96px,130px)}
      .history{grid-template-rows:auto auto minmax(260px,auto)}
      .history .panel-head{display:block}.tabs{margin:8px 0 0;flex-wrap:wrap;justify-content:flex-start}
      .mode-tabs{min-height:34px;flex-wrap:wrap}
      .tabs label:first-child{margin-left:0}.tab{min-height:34px}
      .events{grid-template-rows:auto auto}.event-list{max-height:320px;overflow:auto}
      .error-banner{left:14px;right:14px;bottom:14px}
    }
    @media (max-width:480px){
      .additional-list{grid-template-columns:minmax(0,1fr)}
      .tickets{grid-auto-columns:minmax(96px,1fr)}
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="brand">Codex 额度监控</div><div id="health" class="pill">SYNC</div>
      <div class="meta"><span><b>●</b><i id="network">网络同步中</i></span><span id="wifi">Wi-Fi --</span><span id="refresh">自动刷新 --</span><span id="power">供电 --</span><span id="memory">内存 --</span><span id="sync">最后同步 --</span></div>
    </header>
    <section class="top">
      <div class="panel cyan quota-panel">
        <div>
          <div class="quota-head"><span class="section-title">当前额度</span><span id="remaining" class="quota-number">--%</span><span class="caption">剩余</span><span class="caption countdown-label">剩余时间</span><span id="countdown" class="countdown">--</span></div>
          <div class="tracks"><div id="quotaTrack" class="track track-main"><div id="quotaFill" class="fill"></div></div><div class="track track-time"><div id="timeFill" class="fill time-fill"></div></div></div>
          <div id="secondaryQuota" class="secondary-quota" hidden><div class="secondary-head"><span id="secondaryLabel">周额度</span><span id="secondarySummary"></span></div><div id="secondaryTrack" class="mini-track"><div id="secondaryFill" class="fill"></div></div></div>
          <div class="quota-foot"><span id="window">--周期</span><span id="reset">等待同步</span></div>
        </div>
        <div class="divider"></div>
        <div id="additional" class="additional-list"><div class="empty">暂无附加额度</div></div>
      </div>
      <div class="panel purple credits">
        <div class="credits-head"><span class="caption">余额</span><span id="balance" class="balance">--</span><span id="resetCount" class="reset-count">重置卡 -- 张</span></div>
        <div id="tickets" class="tickets"><div class="empty">到期明细暂不可用</div></div>
      </div>
    </section>
    <section class="bottom">
      <div class="panel history">
        <div class="panel-head"><span class="panel-title">额度历史</span><div class="tabs"><label>滚动窗口</label><button class="tab" data-hours="1">1小时</button><button class="tab" data-hours="6">6小时</button><button class="tab" data-hours="12">12小时</button><button class="tab active" data-hours="24">24小时</button><label>独立周期</label><button class="tab" data-period="today">今天</button><button class="tab" data-period="refresh">刷新周期内</button></div></div>
        <div class="mode-tabs"><button class="mode-tab active" data-mode="remaining">剩余额度</button><button class="mode-tab" data-mode="consumption">额度消耗</button><span id="modeNote" class="mode-note"></span></div>
        <div class="chart-wrap"><canvas id="chart" aria-label="额度历史曲线"></canvas><div id="chartEmpty" class="chart-empty">正在读取历史数据</div><div id="chartTooltip" class="chart-tooltip" hidden></div></div>
      </div>
      <div class="panel events">
        <div class="panel-head"><span class="panel-title">活动记录</span></div><div id="events" class="event-list"><div class="empty">暂无活动记录</div></div>
      </div>
    </section>
  </main>
  <div id="error" class="error-banner">暂时无法连接平板，继续显示最后一次数据</div>
  <script>
    (()=>{
      const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const designWidth=1280,designHeight=800,shell=document.querySelector('.shell');let current=null, period='rolling', hours=24, chartMode='remaining', timer=null,chartPoints=[];
      const pct=v=>v==null?'--':Math.round(v), two=v=>String(v).padStart(2,'0');
      const percent=v=>v==null?'--':`${Number(Number(v).toFixed(Math.abs(Number(v))<1?2:1))}%`;
      const quotaLabel=s=>s===604800?'周':duration(s);
      const colorStops=[[0,'#e87886'],[25,'#f07852'],[50,'#d9a85a'],[75,'#a9ce68'],[100,'#4fd39a']];
      function quotaColor(value){const n=Math.max(0,Math.min(100,Number(value)||0));for(let i=1;i<colorStops.length;i++){const[a,ca]=colorStops[i-1],[b,cb]=colorStops[i];if(n<=b){const t=(n-a)/(b-a),rgb=x=>parseInt(x,16),parts=[1,3,5].map(k=>Math.round(rgb(ca.slice(k,k+2))+(rgb(cb.slice(k,k+2))-rgb(ca.slice(k,k+2)))*t).toString(16).padStart(2,'0'));return `#${parts.join('')}`}}return colorStops.at(-1)[1]}
      function shade(hex,amount){const rgb=[1,3,5].map(k=>parseInt(hex.slice(k,k+2),16));return '#'+rgb.map(v=>Math.round(v+(amount>0?255-v:-v)*Math.abs(amount)).toString(16).padStart(2,'0')).join('')}
      const quotaGradient=value=>{const color=quotaColor(value);return `linear-gradient(90deg,${shade(color,-.12)},${color},${shade(color,.14)})`};
      function setQuotaTrack(value){const track=$('quotaTrack'),segmented=current?.usage?.windows?.[0]?.durationSeconds!==18000,mode=String(segmented);if(track.dataset.segmented!==mode){track.dataset.segmented=mode;track.classList.toggle('segmented',segmented);track.innerHTML=segmented?Array.from({length:7},()=>'<div class="track-segment"><div class="fill quota-segment-fill"></div></div>').join(''):'<div id="quotaFill" class="fill"></div>'}const n=Math.max(0,Math.min(100,Number(value)||0)),gradient=quotaGradient(value);if(segmented){[...track.querySelectorAll('.quota-segment-fill')].forEach((fill,i)=>{fill.style.width=`${Math.max(0,Math.min(100,n*7-i*100))}%`;fill.style.background=gradient})}else{const fill=$('quotaFill');fill.style.width=`${n}%`;fill.style.background=gradient}}
      const consumptionAxisMax=rows=>{const highest=rows.reduce((max,r)=>Math.max(max,Number(r.consumedPercent)||0),0);return [0.5,1,2,5,10,20,25,40,50,80,100].find(v=>highest*1.1<=v)||100};
      const localDate=v=>{if(!v)return'--';const d=new Date(v);return `${two(d.getMonth()+1)}-${two(d.getDate())} ${two(d.getHours())}:${two(d.getMinutes())}`};
      const clock=ms=>{if(ms<=0)return'等待刷新';const s=Math.floor(ms/1000),d=Math.floor(s/86400),h=Math.floor(s/3600)%24;return `${d>0?`${d}天 `:''}${two(h)}:${two(Math.floor(s/60)%60)}:${two(s%60)}`};
      const duration=s=>{if(s==null)return'--';if(s%86400===0)return`${s/86400}天`;if(s%3600===0)return`${s/3600}小时`;if(s%60===0)return`${s/60}分钟`;return`${s}秒`};
      const consumptionMeasure=s=>s===3600?'小时':duration(s);
      function updateClock(){const w=current?.usage?.windows?.[0];if(!w?.resetAt){$('countdown').textContent='--';return}const left=new Date(w.resetAt)-Date.now();$('countdown').textContent=clock(left);if(w.durationSeconds){$('timeFill').style.width=`${Math.max(0,Math.min(100,left/1000/w.durationSeconds*100))}%`}}
      function render(data){current=data;const h=(data.health||'loading').toUpperCase();$('health').textContent=h;$('health').style.color=h==='LIVE'?'var(--green)':h==='AUTH'?'var(--danger)':h==='OFFLINE'?'var(--warning)':'var(--cyan)';$('health').style.borderColor='currentColor';$('network').textContent=h==='LIVE'?'网络 在线':`网络 ${h}`;$('wifi').textContent=`Wi-Fi ${data.device?.wifiIp||location.hostname}`;$('refresh').textContent=`自动刷新 ${data.refreshSeconds||'--'}s`;$('power').textContent=data.device?.charging?'已供电':'电池供电';$('memory').textContent=data.device?.memoryMb==null?'内存 --':`内存 ${Number(data.device.memoryMb).toFixed(1)} MB`;$('sync').textContent=`最后同步 ${data.lastSync?new Date(data.lastSync).toLocaleTimeString('zh-CN',{hour12:false}):'--'}`;
        const u=data.usage,w=u?.windows?.[0],secondary=u?.windows?.[1];$('remaining').textContent=`${pct(w?.remainingPercent)}%`;$('remaining').style.color=quotaColor(w?.remainingPercent);setQuotaTrack(w?.remainingPercent);$('window').textContent=`${quotaLabel(w?.durationSeconds)}周期`;$('reset').textContent=w?`已使用 ${pct(w.usedPercent)}% · ${w.resetAt?localDate(w.resetAt)+' 重置':'重置时间未知'}`:'等待同步';$('secondaryQuota').hidden=!secondary;if(secondary){$('secondaryLabel').textContent=`${quotaLabel(secondary.durationSeconds)}额度`;$('secondarySummary').textContent=`剩余 ${pct(secondary.remainingPercent)}% · ${secondary.resetAt?clock(new Date(secondary.resetAt)-Date.now()):'重置时间未知'}`;$('secondaryFill').style.width=`${Math.max(0,Math.min(100,Number(secondary.remainingPercent)||0))}%`;$('secondaryFill').style.background=quotaGradient(secondary.remainingPercent)}updateClock();
        const additions=u?.additional||[];$('additional').innerHTML=additions.length?additions.map(a=>{const aw=a.windows?.[0],detail=(a.windows||[]).map(x=>`${quotaLabel(x.durationSeconds)}周期 · 剩余 ${pct(x.remainingPercent)}% · ${x.resetAt?localDate(x.resetAt):'重置时间未知'}`).join(' / ');return `<div class="additional"><div class="additional-head"><span class="additional-name">${esc(a.name?.toLowerCase()==='gpt-reserve'?'GPT Reserve':'附加额度 · '+(a.name||'--'))}</span><span class="additional-value" style="color:${quotaColor(aw?.remainingPercent)}">${pct(aw?.remainingPercent)}%</span></div><div class="mini-track"><div class="fill" style="width:${Number(aw?.remainingPercent||0)}%;background:${quotaGradient(aw?.remainingPercent)}"></div></div><div class="additional-detail">${esc(detail||'暂无额度数据')}</div></div>`}).join(''):'<div class="empty">暂无附加额度</div>';
        $('balance').textContent=u?.credits?.unlimited?'Unlimited':u?.credits?.balance||'--';$('resetCount').textContent=`重置卡 ${u?.resetCredits??'--'} 张`;const cards=u?.resetCards;$('tickets').innerHTML=cards==null?'<div class="empty">到期明细暂不可用</div>':cards.length?cards.slice().sort((a,b)=>new Date(a.expiresAt)-new Date(b.expiresAt)).map((c,i)=>{const left=c.expiresAt?new Date(c.expiresAt)-Date.now():null,days=left==null?null:Math.max(0,Math.floor(left/86400000)),urgent=left!=null&&left<=3*86400000;return `<div class="ticket ${urgent?'urgent':''}"><div class="ticket-id">卡 ${two(i+1)}</div><div><div class="caption">剩余</div><div class="ticket-days">${days==null?'--':two(Math.min(99,days))}</div><div class="ticket-unit">天</div></div><div class="ticket-date">${c.expiresAt?new Date(c.expiresAt).toLocaleDateString('zh-CN'):'日期未知'}</div></div>`}).join(''):'<div class="empty">暂无可用重置卡</div>';
        const events=data.events||[];$('events').innerHTML=events.length?events.map(e=>`<div class="event" data-type="${esc(e.type)}"><span class="dot"></span><div><div class="event-title">${esc(e.title)}</div><div class="event-desc">${esc(e.description)}</div></div><span class="event-time">${new Date(e.timestamp).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false})}</span></div>`).join(''):'<div class="empty">暂无活动记录</div>';$('modeNote').textContent=chartMode==='consumption'?`每根柱为${duration(data.consumptionUnitSeconds||3600)}累计消耗`:'';drawChart(data);schedule(data.refreshSeconds);}
      function drawChart(data){
        const canvas=$('chart'),dpr=devicePixelRatio||1,w=Math.max(1,canvas.clientWidth),h=Math.max(1,canvas.clientHeight);
        canvas.width=w*dpr;canvas.height=h*dpr;const c=canvas.getContext('2d');c.scale(dpr,dpr);c.clearRect(0,0,w,h);
        const consumption=chartMode==='consumption',rows=consumption?(data.consumptionHistory||[]):(data.history||[]).filter(x=>x.remainingPercent!=null);
        const groups=new Map();rows.forEach(row=>{const seconds=row.durationSeconds??(row.windowType==='secondary'?604800:18000);if(!groups.has(seconds))groups.set(seconds,[]);groups.get(seconds).push(row)});
        const series=[...groups].sort((a,b)=>a[0]-b[0]).map(([durationSeconds,items])=>({durationSeconds,rows:items,color:durationSeconds===604800?'#48e5a4':'#42d9ff',label:quotaLabel(durationSeconds)}));
        const start=new Date(data.period.start).getTime(),end=new Date(data.period.end).getTime(),narrow=w<420,pad={l:44,r:14,t:narrow?52:42,b:28};
        chartPoints=[];$('chartTooltip').hidden=true;$('chartEmpty').textContent=consumption?'此时间段暂无可计算的消耗 · 至少需要两次有效记录':'此时间段暂无记录';$('chartEmpty').hidden=rows.length>0;if(!rows.length||end<=start)return;
        const axisMax=consumption?consumptionAxisMax(rows):100,plotWidth=w-pad.l-pad.r,plotHeight=h-pad.t-pad.b;
        const xFor=r=>pad.l+(new Date(r.timestamp).getTime()-start)/(end-start)*plotWidth;
        const value=r=>consumption?r.consumedPercent:r.remainingPercent;
        const yFor=r=>pad.t+(1-value(r)/axisMax)*plotHeight;
        c.font='10px Segoe UI';c.strokeStyle='#223044';c.lineWidth=1;
        for(let i=0;i<=4;i++){
          const y=pad.t+plotHeight*i/4;c.beginPath();c.moveTo(pad.l,y);c.lineTo(w-pad.r,y);c.stroke();
          c.fillStyle=consumption?'#48e5a4':'#7f91a8';c.textAlign='left';c.fillText(percent(axisMax*(4-i)/4),4,y+3);
        }
        c.fillStyle='#7f91a8';c.textAlign='center';
        for(let i=0;i<=4;i++){const x=pad.l+plotWidth*i/4,d=new Date(start+(end-start)*i/4);c.fillText(`${two(d.getHours())}:${two(d.getMinutes())}`,x,h-7)}
        if(consumption){
          const unitMs=(data.consumptionUnitSeconds||3600)*1000,slotCount=Math.max(1,Math.ceil((end-start)/unitMs)+1);
          const slotWidth=plotWidth/slotCount,groupWidth=Math.min(14,Math.max(slotCount<=25?7:2,slotWidth*.62)),barWidth=Math.max(2,groupWidth/Math.max(1,series.length)*.78);
          series.forEach((window,index)=>window.rows.forEach(r=>{
            const slot=Math.floor((new Date(r.timestamp).getTime()-start)/unitMs),center=pad.l+(slot+.5)*slotWidth;
            const x=Math.max(pad.l+barWidth/2,Math.min(w-pad.r-barWidth/2,center+(index-(series.length-1)/2)*barWidth));
            const barHeight=Math.max(2,Math.min(plotHeight,Math.max(0,Number(r.consumedPercent)||0)/axisMax*plotHeight));
            c.fillStyle=window.color;c.fillRect(x-barWidth/2,pad.t+plotHeight-barHeight,barWidth,barHeight);
            chartPoints.push({row:r,x,hitWidth:Math.max(10,barWidth/2+5)});
          }));
        }else{
          series.forEach(window=>{c.strokeStyle=window.color;c.lineWidth=2.5;c.beginPath();window.rows.forEach((r,i)=>{const x=xFor(r),y=yFor(r);i?c.lineTo(x,y):c.moveTo(x,y)});c.stroke();chartPoints.push(...window.rows.map(row=>({row,x:xFor(row),hitWidth:20}))) });
        }
        c.font='11px Segoe UI';c.textAlign='left';let legendX=pad.l;const measure=consumptionMeasure(data.consumptionUnitSeconds||3600);
        series.forEach(window=>{const latest=window.rows[window.rows.length-1];c.fillStyle=window.color;c.fillRect(legendX,9,12,3);const label=`${window.label} ${consumption?'消耗':'剩余'} ${percent(value(latest))}`;c.fillText(label,legendX+18,14);legendX+=Math.min(180,c.measureText(label).width+34)});
        if(consumption&&!narrow){c.fillStyle='#7f91a8';c.fillText(`每${measure} · 刻度上限 ${percent(axisMax)}`,legendX+4,14)}
      }
      $('chart').addEventListener('pointermove',e=>{
        const canvas=$('chart'),tip=$('chartTooltip'),rect=canvas.getBoundingClientRect();
        const x=(e.clientX-rect.left)*canvas.clientWidth/rect.width,y=(e.clientY-rect.top)*canvas.clientHeight/rect.height;
        const nearest=chartPoints.reduce((best,p)=>!best||Math.abs(p.x-x)<Math.abs(best.x-x)?p:best,null);
        if(!nearest||Math.abs(nearest.x-x)>nearest.hitWidth){tip.hidden=true;return}
        const row=nearest.row;tip.textContent=`${localDate(row.timestamp)} · ${quotaLabel(row.durationSeconds)} ${chartMode==='consumption'?`每${consumptionMeasure(current?.consumptionUnitSeconds||3600)}消耗 ${percent(row.consumedPercent)}`:`剩余 ${percent(row.remainingPercent)}`}`;
        tip.hidden=false;tip.style.left=`${Math.min(canvas.clientWidth-tip.offsetWidth-4,Math.max(4,x+12))}px`;
        tip.style.top=`${Math.max(4,y-tip.offsetHeight-10)}px`;
      });
      $('chart').addEventListener('pointerleave',()=>{$('chartTooltip').hidden=true});
      function schedule(seconds){clearTimeout(timer);timer=setTimeout(load,Math.max(10,Number(seconds)||30)*1000)}
      async function load(){try{const q=new URLSearchParams(period==='rolling'?{period,hours}:{period});const r=await fetch(`/api/dashboard?${q}`,{cache:'no-store'});if(!r.ok)throw Error();render(await r.json());$('error').classList.remove('show')}catch(_){$('error').classList.add('show');schedule(30)}}
      function fitDashboard(){const stacked=matchMedia('(orientation:portrait), (max-width:900px)').matches,scale=stacked?1:Math.min(1,innerWidth/designWidth,innerHeight/designHeight);shell.style.setProperty('--dashboard-scale',String(Math.max(.1,scale)));if(current)requestAnimationFrame(()=>drawChart(current))}
      document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');period=b.dataset.period||'rolling';hours=Number(b.dataset.hours||24);load()}));
      document.querySelectorAll('.mode-tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.mode-tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');chartMode=b.dataset.mode;$('modeNote').textContent=chartMode==='consumption'?`每根柱为${duration(current?.consumptionUnitSeconds||3600)}累计消耗`:'';$('chart').setAttribute('aria-label',chartMode==='consumption'?'额度消耗柱状图':'额度剩余历史曲线');if(current)drawChart(current)}));
      addEventListener('resize',fitDashboard);fitDashboard();setInterval(updateClock,1000);load();
    })();
  </script>
</body>
</html>
